name: mission-build-18974793

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build (Next.js static export)
        run: npm run build

      - name: Verify out/ exists
        run: |
          test -d out
          echo "Build output directory contents:"
          find out -type f | head -50
          echo "---"
          du -sh out
